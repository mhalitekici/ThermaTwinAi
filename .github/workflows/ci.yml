name: Verify MVP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q -rs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:config
      - run: npm run test:unit
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:integration
      - name: Render local historical email previews without transport
        run: uv run python scripts/preview_emails.py
      - name: Verify email layouts, themes, keyboard and no external requests
        run: node scripts/capture-email-previews.mjs after
      - run: npm run test:deployment
      - run: npm run build
      - name: Build isolated API container
        run: docker build -f deploy/api/Dockerfile -t thermatwin-api:ci .
      - name: Verify API runtime and preview safety without ML or provider credentials
        run: docker run --rm -e APP_ENV=preview -e TEST_EMAIL_ENABLED=true -e NOTIFICATION_MODE=live -e AUTOMATIC_EMAILS_APPROVED=true -e ENABLE_FORECAST_EMAILS=true thermatwin-api:ci python /app/smoke_api_runtime.py
      - name: Verify production HTTP boundaries without real provider credentials
        run: docker run --rm -e APP_ENV=production -e APP_URL=https://frontend.example -e ALLOWED_ORIGINS=https://frontend.example -e SUPABASE_URL=https://project.example -e SUPABASE_SERVICE_ROLE_KEY=fixture-only -e RESEND_API_KEY=fixture-only -e EMAIL_FROM=test@example.test thermatwin-api:ci python /app/smoke_api_runtime.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: product-review-screenshots
          path: artifacts/product-upgrade/ci/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: email-review-previews
          path: artifacts/product-upgrade/email-after/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 3
