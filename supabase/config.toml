project_id = "thermatwin-ai"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
otp_length = 8
otp_expiry = 600

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "env(SMTP_SENDER_EMAIL)"
sender_name = "ThermaTwin AI"

[auth.email.template.magic_link]
subject = "ThermaTwin AI — Giriş doğrulama kodunuz"
content_path = "./supabase/templates/otp.html"

[auth.email.template.confirmation]
subject = "ThermaTwin AI — E-posta doğrulama kodunuz"
content_path = "./supabase/templates/otp.html"
