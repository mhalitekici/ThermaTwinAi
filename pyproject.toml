[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "thermatwin-ai"
version = "0.1.0"
description = "Traceable daily SST forecasting and anomaly monitoring for Akkuyu"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "xarray>=2025.1,<2027",
  "netCDF4>=1.7,<2",
  "xgboost>=3,<4",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "copernicusmarine>=2.2,<3",
  "fsspec[http]>=2026.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pglast>=7,<8"]

[project.scripts]
thermatwin = "thermatwin.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
